name: Deploy Seller Portal to Azure Static Web Apps

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build
        env:
          VITE_WA_API_URL: https://api.prod.whatsapp-service.epocketshop.store
          VITE_SHOP_API_URL: https://api.prod.epocketshop-service.epocketshop.store
          VITE_STOREFRONT_URL: https://epocketshop.store
          VITE_ANALYTICS_URL: https://api.prod.data-analysis-service.epocketshop.store
          VITE_AI_AGENT_URL: https://api.prod.ai-service.epocketshop.store

      - name: Upload to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "dist"
